<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Appearance & Preferences — SEATWISE</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/dashboard.css" />
<link rel="stylesheet" href="css/responsive.css" />

</head>
<body>
<div class="dashboard-bg" aria-hidden="true">
  <div class="blob-1"></div>
  <div class="blob-2"></div>
</div>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">S</div>
      <div class="brand-copy">
        <div class="brand-name"><strong>SEAT</strong><span>WISE</span></div>
        <div class="brand-tagline">Student Portal</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="user-dashboard.html"><span class="nav-icon">🏠</span><span class="nav-label">Dashboard</span></a>
      <a href="my-exams.html"><span class="nav-icon">📘</span><span class="nav-label">My Exams</span></a>
      <a href="my-seat.html"><span class="nav-icon">🎫</span><span class="nav-label">Admit Card</span></a>
      <a href="profile.html" class="active"><span class="nav-icon">👤</span><span class="nav-label">Profile</span></a>
    </nav>
    <div class="sidebar-footer">
      <button data-logout><span class="nav-icon">↩</span><span class="nav-label">Logout</span></button>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <h1>Preferences</h1>
      <div class="topbar-right">
        <div class="user-chip">
          <div class="user-avatar" data-current-user-initial>?</div>
          <span data-current-user-name>Student</span>
        </div>
      </div>
    </header>

    <main class="page-content" style="max-width:760px; margin:0 auto;">
      
      <!-- PROFILE SUB-NAVIGATION BAR -->
      <nav class="profile-subnav mb-24">
        <a href="profile.html" class="subnav-item"> Personal Information</a>
        <a href="update-password.html" class="subnav-item">Update Password</a>
        <a href="complaint.html" class="subnav-item"> Complaint</a>
        <a href="preferences.html" class="subnav-item active">⚙ Preferences</a>
      </nav>

      <!-- CARD 1: APPEARANCE PREFERENCES -->
      <div class="card mb-24">
        <div class="card-title">Appearance</div>
        <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 0;">
          <div>
            <div style="font-weight:700; color:var(--ink); font-size:14px;">Dark Mode</div>
            <div style="font-size:12px; color:var(--muted); margin-top:2px;">Switch between light and dark appearance.</div>
          </div>
          <label class="toggle-wrap">
            <input type="checkbox" id="pref-theme-toggle" />
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>

      <!-- CARD 2: NAVIGATION PREFERENCES -->
      <div class="card mb-24">
        <div class="card-title">Navigation</div>
        <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 0;">
          <div>
            <div style="font-weight:700; color:var(--ink); font-size:14px;">Compact Sidebar</div>
            <div style="font-size:12px; color:var(--muted); margin-top:2px;">Use a compact sidebar with icons only.</div>
          </div>
          <label class="toggle-wrap">
            <input type="checkbox" id="pref-sidebar-toggle" />
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/settingsManager.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/preferences.js"></script>
<script src="js/app.js"></script>
</body>
</html>
