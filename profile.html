<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile — SEATWISE</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/dashboard.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
<div class="dashboard-bg" aria-hidden="true">
  <div class="blob-1"></div>
  <div class="blob-2"></div>
</div>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">S</div>
      <div class="brand-copy">
        <div class="brand-name"><strong>SEAT</strong><span>WISE</span></div>
        <div class="brand-tagline">Student Portal</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="user-dashboard.html"><span class="nav-icon">🏠</span><span class="nav-label">Dashboard</span></a>
      <a href="my-exams.html"><span class="nav-icon">📘</span><span class="nav-label">My Exams</span></a>
      <a href="my-seat.html"><span class="nav-icon">🎫</span><span class="nav-label">My Seat</span></a>
      <a href="profile.html"><span class="nav-icon">👤</span><span class="nav-label">Profile</span></a>
    </nav>
    <div class="sidebar-footer">
      <button data-logout><span class="nav-icon">↩</span><span class="nav-label">Logout</span></button>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <h1>Student Profile</h1>
      <div class="topbar-right">
        <div class="user-chip">
          <div class="user-avatar" data-current-user-initial>?</div>
          <span data-current-user-name>Student</span>
        </div>
      </div>
    </header>

    <main class="page-content">
      <div class="card" style="max-width:520px; margin:20px auto;">
        <div class="card-title">Student Account Details</div>
        <form id="profile-form">
          <div class="form-group">
            <label class="form-label" for="name">Full Name</label>
            <input class="form-input" id="name" placeholder="e.g. Rahul Sharma" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input class="form-input" id="email" type="email" placeholder="e.g. rahul@student.com" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="rollNo">Linked University Roll Number</label>
            <input class="form-input" id="rollNo" placeholder="e.g. 23CSE101" />
            <div class="form-hint">Link your exact roll number to see your allocated seat and exam room. Must match a record in the student directory.</div>
          </div>
          <button type="submit" class="btn btn-primary btn-block mt-20">Save Profile Changes</button>
        </form>
      </div>
    </main>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/settingsManager.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/users.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/app.js"></script>
<script>
  Auth.requireUser();

  function loadUser() {
    const current = Auth.currentUser();
    const record = STORAGE.getUsers().find((u) => u.id === current.id);
    if (!record) return;
    document.getElementById("name").value = record.name || "";
    document.getElementById("email").value = record.email || "";
    document.getElementById("rollNo").value = record.rollNo || "";
  }

  document.getElementById("profile-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const current = Auth.currentUser();
    const result = Users.update(current.id, {
      name: document.getElementById("name").value.trim(),
      email: document.getElementById("email").value.trim(),
      rollNo: document.getElementById("rollNo").value.trim()
    });
    if (result.ok) {
      showToast("Profile updated successfully.", "success");
      App._renderCurrentUserBadge();
    } else {
      showToast(result.message, "error");
    }
  });

  loadUser();
</script>
</body>
</html>
