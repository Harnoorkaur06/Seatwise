<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Seat — SEATWISE</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/dashboard.css" />
<link rel="stylesheet" href="css/seating.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
<div class="dashboard-bg" aria-hidden="true">
  <div class="blob-1"></div>
  <div class="blob-2"></div>
</div>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">S</div>
      <div class="brand-copy">
        <div class="brand-name"><strong>SEAT</strong><span>WISE</span></div>
        <div class="brand-tagline">Student Portal</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="user-dashboard.html"><span class="nav-icon">🏠</span><span class="nav-label">Dashboard</span></a>
      <a href="my-exams.html"><span class="nav-icon">📘</span><span class="nav-label">My Exams</span></a>
      <a href="my-seat.html"><span class="nav-icon">🎫</span><span class="nav-label">My Seat</span></a>
      <a href="profile.html"><span class="nav-icon">👤</span><span class="nav-label">Profile</span></a>
    </nav>
    <div class="sidebar-footer">
      <button data-logout><span class="nav-icon">↩</span><span class="nav-label">Logout</span></button>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <h1>My Examination Seat Card</h1>
      <div class="topbar-right">
        <div class="user-chip">
          <div class="user-avatar" data-current-user-initial>?</div>
          <span data-current-user-name>Student</span>
        </div>
      </div>
    </header>

    <main class="page-content" style="max-width:680px; margin:0 auto;">
      
      <!-- EXAMINATION SELECTOR TOOLBAR -->
      <div class="card mb-20">
        <div class="flex-between" style="flex-wrap:wrap; gap:12px;">
          <div>
            <div class="card-title" style="margin-bottom:2px;">Select Examination Pass</div>
            <div class="card-subtitle" style="margin-bottom:0;">Choose an examination to inspect your allocated seating pass</div>
          </div>
          <div style="min-width:240px;">
            <select class="form-select" id="exam-select" style="font-weight:700; font-size:14px; padding:10px 14px; border-color:var(--accent-border);"></select>
          </div>
        </div>
      </div>

      <div id="seat-content"></div>
    </main>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/settingsManager.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/exams.js"></script>
<script src="js/seatingAlgorithm.js"></script>
<script src="js/seating.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/app.js"></script>
<script>
  Auth.requireUser();

  const examSelect = document.getElementById("exam-select");
  const urlParams = new URLSearchParams(window.location.search);
  const requestedExamId = urlParams.get("examId");

  function init() {
    const exams = Exams.all();
    if (exams.length === 0) {
      examSelect.innerHTML = `<option value="">No exams scheduled</option>`;
      document.getElementById("seat-content").innerHTML = `
        <div class="empty-state card">
          <div class="empty-icon">📘</div>
          <div class="empty-title">No examinations scheduled yet</div>
          <div class="empty-desc">Check back later for university exam timetable updates.</div>
        </div>`;
      return;
    }

    examSelect.innerHTML = exams.map((e) => `<option value="${e.id}">${escapeHTML(e.name)} (${formatDate(e.date)})</option>`).join("");
    
    if (requestedExamId && exams.some((e) => e.id === requestedExamId)) {
      examSelect.value = requestedExamId;
    }

    examSelect.addEventListener("change", () => renderSeatPass());
    renderSeatPass();
  }

  function renderSeatPass() {
    const selectedExamId = examSelect.value;
    const user = Auth.currentUser();
    const exams = Exams.all();
    const exam = exams.find((e) => e.id === selectedExamId);
    const plan = Seating.getCurrentPlan(selectedExamId);
    const seat = user && user.rollNo ? Seating.findByRollNo(user.rollNo, selectedExamId) : null;
    const container = document.getElementById("seat-content");

    if (!user || !user.rollNo) {
      container.innerHTML = `
        <div class="empty-state card">
          <div class="empty-icon">👤</div>
          <div class="empty-title">Roll Number Unlinked</div>
          <div class="empty-desc">Your profile does not have a University Roll Number linked yet. Please visit your profile settings to link your roll number.</div>
          <a href="profile.html" class="btn btn-primary mt-14" style="display:inline-flex;">Go to Profile</a>
        </div>`;
      return;
    }

    if (!plan) {
      container.innerHTML = `
        <div class="empty-state card">
          <div class="empty-icon">🎫</div>
          <div class="empty-title">Seating has not been generated for this examination yet</div>
          <div class="empty-desc">The examination department is preparing room allocations for <strong>${escapeHTML(exam ? exam.name : "this exam")}</strong>. Please check back soon.</div>
        </div>`;
      return;
    }

    if (!seat) {
      container.innerHTML = `
        <div class="empty-state card">
          <div class="empty-icon">🎫</div>
          <div class="empty-title">No seat assigned for this examination</div>
          <div class="empty-desc">Seating was generated for ${escapeHTML(exam ? exam.name : "this exam")}, but your roll number (<strong>${escapeHTML(user.rollNo)}</strong>) was not found in this seating plan. Contact administrator if this is an issue.</div>
          <a href="complaint.html" class="btn btn-secondary mt-14" style="display:inline-flex;">Contact Admin</a>
        </div>`;
      return;
    }

    container.innerHTML = `
      <div class="seat-card-hero">
        <div class="flex-between">
          <div>
            <div style="font-size:11px; font-weight:800; letter-spacing:0.12em; text-transform:uppercase; color:var(--purple-4);">OFFICIAL SEATING PASS</div>
            <div style="font-size:22px; font-weight:900; margin-top:4px; color:var(--ink);">${escapeHTML(exam ? exam.name : "Examination")}</div>
          </div>
          <div class="seat-big-badge">${escapeHTML(seat.seat)}</div>
        </div>

        <div class="seat-hero-grid" style="grid-template-columns:1fr 1fr; margin-top:20px;">
          <div class="seat-hero-field"><div class="field-label">Date</div><div class="field-value">${exam ? formatDate(exam.date) : "-"}</div></div>
          <div class="seat-hero-field"><div class="field-label">Time</div><div class="field-value">${exam ? formatTime(exam.time) : "-"}</div></div>
          <div class="seat-hero-field"><div class="field-label">Assigned Hall</div><div class="field-value" style="color:var(--purple-4);">${escapeHTML(seat.roomNumber)}</div></div>
          <div class="seat-hero-field"><div class="field-label">Allocated Seat</div><div class="field-value" style="color:var(--purple-4);">${escapeHTML(seat.seat)}</div></div>
          <div class="seat-hero-field"><div class="field-label">Student Roll No.</div><div class="field-value">${escapeHTML(seat.rollNo)}</div></div>
          <div class="seat-hero-field"><div class="field-label">Subject Code</div><div class="field-value">${escapeHTML(seat.subject)}</div></div>
        </div>

        <div style="margin-top:20px; padding:14px; border-radius:var(--radius-sm); background:rgba(154,59,185,0.06); border:1px solid rgba(154,59,185,0.12); font-size:12px; color:var(--muted); line-height:1.5;">
          📌 <strong>Exam Hall Instructions:</strong> Please arrive at least 15 minutes before the scheduled time. Carry your university student ID card. Maintain proper silence in the examination room.
        </div>

        <button class="btn btn-secondary btn-block mt-20 no-print" onclick="window.print()">🖨 Print Seat Pass</button>
      </div>
    `;
  }

  init();
</script>
</body>
</html>
