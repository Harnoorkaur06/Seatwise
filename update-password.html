<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Update Password — SEATWISE</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/dashboard.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
<div class="dashboard-bg" aria-hidden="true">
  <div class="blob-1"></div>
  <div class="blob-2"></div>
</div>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">S</div>
      <div class="brand-copy">
        <div class="brand-name"><strong>SEAT</strong><span>WISE</span></div>
        <div class="brand-tagline">Student Portal</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="user-dashboard.html"><span class="nav-icon">🏠</span><span class="nav-label">Dashboard</span></a>
      <a href="my-exams.html"><span class="nav-icon">📘</span><span class="nav-label">My Exams</span></a>
      <a href="my-seat.html"><span class="nav-icon">🎫</span><span class="nav-label">My Seat</span></a>
      <a href="profile.html"><span class="nav-icon">👤</span><span class="nav-label">Profile</span></a>
    </nav>
    <div class="sidebar-footer">
      <button data-logout><span class="nav-icon">↩</span><span class="nav-label">Logout</span></button>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <h1>Update Password</h1>
      <div class="topbar-right">
        <div class="user-chip">
          <div class="user-avatar" data-current-user-initial>?</div>
          <span data-current-user-name>Student</span>
        </div>
      </div>
    </header>

    <main class="page-content" style="max-width:760px; margin:0 auto;">
      
      <!-- PROFILE SUB-NAVIGATION BAR -->
      <nav class="profile-subnav mb-24">
        <a href="profile.html" class="subnav-item">👤 Personal Information</a>
        <a href="update-password.html" class="subnav-item active">🔐 Update Password</a>
        <a href="complaint.html" class="subnav-item">💬 Complaint</a>
        <a href="preferences.html" class="subnav-item">⚙ Preferences</a>
      </nav>

      <!-- SECURITY & CHANGE PASSWORD CARD -->
      <div class="card mb-24">
        <div class="card-title">Update Password</div>
        <div class="form-hint mb-16">Ensure your student account remains safe with a strong password.</div>
        <form id="profile-pwd-form">
          <div class="form-group">
            <label class="form-label" for="pwd-current">Current Password</label>
            <input class="form-input" type="password" id="pwd-current" placeholder="••••••••" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="pwd-new">New Password</label>
            <input class="form-input" type="password" id="pwd-new" placeholder="At least 6 characters" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="pwd-confirm">Confirm New Password</label>
            <input class="form-input" type="password" id="pwd-confirm" placeholder="Re-enter new password" required />
          </div>
          <button type="submit" class="btn btn-primary mt-14">Update Password</button>
        </form>
      </div>

    </main>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/settingsManager.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/students.js"></script>
<script src="js/update-password.js"></script>
<script src="js/app.js"></script>
</body>
</html>
